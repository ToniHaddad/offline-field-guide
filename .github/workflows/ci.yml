name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Build the sample guide
        run: fieldguide build manuals/cert-basic-training-participant-manual.pdf --out site
      - name: Benchmark (the same JavaScript search under Node)
        run: node bench/run_bench.js site
