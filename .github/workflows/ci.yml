name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Build both guides (handbook at the root, CERT manual in cert/)
        run: |
          fieldguide build manuals/warehouse-keeper-handbook.pdf --out site --related "FEMA CERT manual=cert/"
          fieldguide build manuals/cert-basic-training-participant-manual.pdf --out site/cert --related "Handbook=../"
      - name: Benchmark, handbook
        run: node bench/run_bench.js site bench/handbook-questions.json
      - name: Benchmark, CERT manual
        run: node bench/run_bench.js site/cert bench/cert-questions.json
