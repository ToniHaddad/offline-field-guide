[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-field-guide"
version = "0.1.0"
description = "Turn a long PDF manual into a searchable guide that works on a phone with no connection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fieldguide = "fieldguide.cli:main"

[tool.setuptools]
packages = ["fieldguide"]

[tool.setuptools.package-data]
fieldguide = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
