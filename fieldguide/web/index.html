<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ - Field Guide</title>
<meta name="description" content="Offline search for __TITLE__">
<meta name="theme-color" content="#1f3b3a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f1ea;
  --surface: #fffdf8;
  --ink: #1b2422;
  --muted: #5a6662;
  --line: #e1dacb;
  --band: #1f3b3a;
  --band-ink: #f4f1ea;
  --band-muted: #a9c2bc;
  --accent: #c8501c;
  --accent-soft: #fbe7dc;
  --ok: #2f8a5f;
  --warn: #c8501c;
  --mark: #ffd97a;
  --mark-ink: #1b2422;
  --step: #1f3b3a;
  --step-ink: #ffffff;
  --shadow: 0 1px 2px rgba(31, 59, 58, .06), 0 4px 14px rgba(31, 59, 58, .06);
  --radius: 14px;
  --fs-xs: 12px; --fs-s: 14px; --fs-m: 16px; --fs-l: 19px; --fs-xl: 24px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1413;
    --surface: #161e1d;
    --ink: #e8e3d7;
    --muted: #97a39f;
    --line: #26312f;
    --band: #0c1211;
    --band-ink: #e8e3d7;
    --band-muted: #8fb3aa;
    --accent: #ff8a4c;
    --accent-soft: #3a2418;
    --ok: #5cc493;
    --warn: #ff8a4c;
    --mark: #8a6512;
    --mark-ink: #fff4d6;
    --step: #8fc7bd;
    --step-ink: #0e1413;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--fs-m)/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font: inherit; color: inherit; }

.band {
  background: var(--band);
  color: var(--band-ink);
  padding: calc(14px + env(safe-area-inset-top)) 16px 52px;
}
.band-inner, main { max-width: 720px; margin: 0 auto; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kicker {
  display: flex; align-items: center; gap: 8px;
  font-size: var(--fs-xs); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--band-muted);
}
.kicker svg { width: 18px; height: 18px; }
.manual-title { margin: 10px 0 0; font-size: var(--fs-l); font-weight: 650; line-height: 1.3; letter-spacing: -.01em; }
.status {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px; border-radius: 999px;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
  font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
}
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: #d8b24a; }
.status[data-state="saved"] .dot { background: #6fd3a0; }
.status[data-state="offline"] .dot { background: #ff9a5c; box-shadow: 0 0 0 3px rgba(255,154,92,.25); }

.search-wrap { position: sticky; top: 0; z-index: 5; margin-top: -36px; padding: 0 16px; }
.search {
  max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 0 14px; height: 56px;
}
.search svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
.search input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink);
  font-size: 18px; height: 100%;
}
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.search:focus-within { border-color: var(--accent); }
.clear { border: 0; background: none; padding: 6px; color: var(--muted); cursor: pointer; display: none; }
.has-query .clear { display: block; }

main { padding: 18px 16px 48px; }
.meta { font-size: var(--fs-s); color: var(--muted); margin: 4px 2px 12px; }

.results { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.result { min-width: 0; }
.result a {
  display: block; text-decoration: none; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 13px;
}
.result a:active { transform: scale(.995); }
.result a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.crumb { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 2px; }
.r-title { font-size: var(--fs-m); font-weight: 650; line-height: 1.3; }
.pg {
  flex: none; font-size: var(--fs-xs); font-weight: 700; color: var(--accent);
  background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap;
}
.snippet { margin: 6px 0 0; font-size: var(--fs-s); color: var(--muted); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 2px; }
.snippet mark { font-weight: 600; }

.empty { text-align: center; color: var(--muted); padding: 32px 12px; }
.empty strong { display: block; color: var(--ink); font-size: var(--fs-l); margin-bottom: 4px; }

.toc h2 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 8px 2px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: var(--fs-s); cursor: pointer; }
.toc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.toc h2 { margin: 0; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.toc details + details { border-top: 1px solid var(--line); }
.toc summary {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  padding: 14px; cursor: pointer; list-style: none; font-weight: 650;
}
.toc summary::-webkit-details-marker { display: none; }
.toc summary span:first-child::before {
  content: ""; display: inline-block; width: 7px; height: 7px; margin: 0 10px 2px 0;
  border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-45deg);
  transition: transform .15s;
}
.toc details[open] summary span:first-child::before { transform: rotate(45deg); }
.toc .cnt { color: var(--muted); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; }
.toc ol { list-style: none; margin: 0; padding: 0 0 6px; }
.toc a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 14px 9px 31px; text-decoration: none; font-size: var(--fs-s); }
.toc li.sub a { padding-left: 47px; color: var(--muted); }
.toc a span:last-child { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; padding-top: 2px; }

/* Section view */
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 0; color: var(--accent); font-weight: 650; cursor: pointer; font-size: var(--fs-s); }
article { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px 8px; margin-top: 6px; }
article h1 { font-size: var(--fs-xl); line-height: 1.2; margin: 6px 0 12px; letter-spacing: -.015em; }
.src { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.src .pg { font-size: var(--fs-s); padding: 4px 10px; }
.btn {
  border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 12px;
  font-size: var(--fs-s); font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.btn svg { width: 16px; height: 16px; }
.body p { margin: 0 0 12px; }
.body ul { margin: 0 0 14px; padding-left: 22px; }
.body ul li { margin-bottom: 6px; }
ol.steps { list-style: none; margin: 4px 0 16px; padding: 0; counter-reset: step var(--start); }
ol.steps li { counter-increment: step; position: relative; padding: 2px 0 10px 42px; min-height: 30px; }
ol.steps li::before {
  content: counter(step); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%;
  background: var(--step); color: var(--step-ink); font-weight: 700; font-size: var(--fs-s);
  display: flex; align-items: center; justify-content: center;
}
ol.steps li + li::after { content: ""; position: absolute; left: 13.5px; top: -10px; height: 10px; width: 1px; background: var(--line); }
.table-wrap { overflow-x: auto; margin: 0 -16px 16px; padding: 0 16px; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-s); min-width: 420px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { background: var(--bg); font-weight: 700; }
.pages { display: grid; gap: 12px; margin: 0 0 16px; }
.pages figure { margin: 0; }
.pages img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.pages figcaption { font-size: var(--fs-xs); color: var(--muted); margin-top: 4px; }
.note { font-size: var(--fs-s); color: var(--muted); }
.note-banner { font-size: var(--fs-s); color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin: 2px 2px 12px; }
.related {
  display: flex; flex-direction: column; gap: 2px; margin-top: 14px; padding: 14px; text-decoration: none;
  background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
}
.related span { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.related strong { color: var(--accent); }
footer { max-width: 720px; margin: 0 auto; padding: 0 16px 32px; font-size: var(--fs-xs); color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="band">
  <div class="band-inner">
    <div class="brand">
      <div class="kicker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h6"/></svg>
        Field Guide
      </div>
      <div class="status" id="status" data-state="saving" role="status"><span class="dot"></span><span id="status-text">Saving for offline</span></div>
    </div>
    <p class="manual-title" id="manual-title">__TITLE__</p>
  </div>
</header>
<div class="search-wrap">
  <label class="search" id="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search the manual" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search the manual">
    <button class="clear" id="clear" type="button" aria-label="Clear search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </label>
</div>
<main id="main" aria-live="polite">
  <p class="meta">Loading the guide...</p>
</main>
<footer id="footer"></footer>
<script src="search.js"></script>
<script src="app.js"></script>
</body>
</html>
